name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1
      # macOS ships Bash 3.2, and that is what `curl | bash` runs there. Put it
      # first on PATH so every script in this job runs under it.
      - name: Use the stock Bash on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/stock-bash"
          ln -s /bin/bash "$RUNNER_TEMP/stock-bash/bash"
          echo "$RUNNER_TEMP/stock-bash" >> "$GITHUB_PATH"
      - name: Show tool versions
        run: |
          bash --version | head -n 1
          git --version
          openspec --version
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck init.sh scripts/*.sh
      - name: Regression tests
        run: ./scripts/regression-test.sh
      - name: End-to-end tests against the real OpenSpec CLI
        run: ./scripts/e2e-test.sh
      - name: Validate the schemas and this repository's specs
        run: |
          openspec schema validate spec-driven-with-impact
          openspec schema validate minimalist
          openspec validate --specs --strict --no-interactive
          openspec validate --archived --no-interactive
      - name: Installed skills match skills/
        run: |
          ./init.sh --with skills
          git diff --exit-code -- .agents .claude
